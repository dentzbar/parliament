<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>פרלמנט</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23159a4a'/%3E%3Ccircle cx='256' cy='256' r='216' fill='%23fff'/%3E%3Ccircle cx='256' cy='256' r='196' fill='%23d0021b'/%3E%3Crect x='112' y='176' width='196' height='160' rx='46' fill='%23fff'/%3E%3Cpath d='M326 236l68-58v156l-68-58z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* apply saved theme before first paint to avoid a flash */
try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('parliament_theme') || 'dark'); }catch(e){}
</script>
<style>
:root{
  --red-deep:#5c0000;
  --red:#a80000;
  --red-bright:#e01515;
  --red-glow:#ff2d2d;
  --bg:#0c0505;
  --bg2:#160808;
  --panel:#1c0d0d;
  --panel2:#241010;
  --line: rgba(255,80,80,0.14);
  --text:#f5eaea;
  --text-dim:#c9a9a9;
  --text-faint:#8a6666;
  --bubble-me: linear-gradient(135deg,#a80000,#6e0000);
  --bubble-them:#241313;
  --font-display:'Rubik',sans-serif;
  --font-body:'Heebo',sans-serif;
}

/* ---------- LIGHT THEME ---------- */
html[data-theme="light"]{
  --red-deep:#8a0000;
  --red:#c40000;
  --red-bright:#e01515;
  --red-glow:#ff4d4d;
  --bg:#fdf6f6;
  --bg2:#fff;
  --panel:#fff;
  --panel2:#f6eaea;
  --line: rgba(140,20,20,0.16);
  --text:#1d0d0d;
  --text-dim:#6d5151;
  --text-faint:#9c8080;
  --bubble-me: linear-gradient(135deg,#d41111,#a80000);
  --bubble-them:#f1e3e3;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overflow:hidden;
  position:fixed; inset:0;
}
#app{position:absolute; inset:0;}

/* ---------- SPLASH ---------- */
#splash{
  position:absolute; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(120% 120% at 50% 20%, #d40000 0%, #7a0000 45%, #250303 100%);
  transition:opacity .5s ease, visibility .5s;
  overflow:hidden;
}
#splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
.logo-mic{
  width:140px; height:140px; border-radius:32px;
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));
}

/* ---------- ONBOARDING ---------- */
#onboard{
  position:absolute; inset:0; z-index:40; background:var(--bg);
  display:none; flex-direction:column; align-items:center; justify-content:center; padding:32px;
  text-align:center;
}
#onboard.show{display:flex;}
.ob-logo{width:74px; height:74px; margin-bottom:18px;}
#onboard h1{font-family:var(--font-display); font-size:24px; margin:0 0 6px;}
#onboard p{color:var(--text-dim); font-size:14px; margin:0 0 26px; line-height:1.6;}
#onboard input{
  width:100%; max-width:300px; background:var(--panel); border:1px solid var(--line);
  color:var(--text); padding:14px 16px; border-radius:14px; font-size:15px; font-family:var(--font-body);
  text-align:center; outline:none;
}
#onboard input:focus{border-color:var(--red-bright);}
#onboard button{
  margin-top:16px; width:100%; max-width:300px; padding:14px; border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--red-bright),var(--red)); color:#fff; font-family:var(--font-display);
  font-weight:600; font-size:15px; letter-spacing:.5px; cursor:pointer;
}
.ob-user-list{
  width:100%; max-width:300px; max-height:200px; overflow-y:auto;
  display:flex; flex-direction:column; gap:6px; margin-bottom:18px;
}
.ob-user-list:empty{display:none;}
.ob-user-row{
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line); cursor:pointer; text-align:right;
}
.ob-user-row:hover{border-color:var(--red-bright);}
.ob-user-row .avatar{width:34px; height:34px; font-size:14px;}
.ob-user-row .ob-user-name{font-size:14px; font-weight:600;}
.ob-divider{
  width:100%; max-width:300px; display:flex; align-items:center; gap:10px;
  color:var(--text-faint); font-size:12px; margin-bottom:14px;
}
.ob-divider::before, .ob-divider::after{content:''; flex:1; height:1px; background:var(--line);}

/* ---------- HEADER (contacts screen) ---------- */
.topbar{
  padding:14px 14px 10px; display:flex; align-items:center; gap:7px;
  background:linear-gradient(180deg,var(--bg2),transparent);
  flex-shrink:0;
}
.topbar .title-logo{width:30px; height:30px; border-radius:8px; flex-shrink:0;}
.topbar h1{font-family:var(--font-display); font-size:19px; font-weight:700; margin:0 4px 0 0; flex:1; min-width:0;}
.icon-btn{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--panel); border:1px solid var(--line); cursor:pointer; flex-shrink:0; position:relative;
}
.icon-btn svg{width:16px; height:16px;}
.notif-dot{
  position:absolute; top:6px; left:7px; width:7px; height:7px; border-radius:50%;
  background:var(--red-bright); border:2px solid var(--bg2);
}
.icon-btn.notif-on{background:linear-gradient(135deg,var(--red-bright),var(--red)); border-color:transparent;}
.icon-btn.emoji-btn{font-size:15px;}
#btnTheme .sun{display:none;}
html[data-theme="light"] #btnTheme .sun{display:block;}
html[data-theme="light"] #btnTheme .moon{display:none;}

#contactsScreen{position:absolute; inset:0; display:flex; flex-direction:column; z-index:1;}

.search-wrap{padding:0 18px 12px; flex-shrink:0;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:10px 14px;
}
.search-box svg{width:16px; height:16px; opacity:.5; flex-shrink:0;}
.search-box input{background:none; border:none; outline:none; color:var(--text); font-family:var(--font-body); font-size:14px; width:100%;}
.search-box input::placeholder{color:var(--text-faint);}

#screens{position:absolute; inset:0; overflow:hidden; z-index:2; pointer-events:none;}
.screen{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
  transform:translateX(102%); transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s;
  pointer-events:none;}
.screen.open{transform:translateX(0); pointer-events:auto;}
.screen.hidden-screen{display:none;}

/* ---------- CONTACT LIST ---------- */
#contactList{flex:1; overflow-y:auto; padding:2px 10px 160px;}
#allFilesBody{flex:1; overflow-y:auto; padding:10px 14px 20px;}
.folder-row{
  display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:14px; cursor:pointer;
}
.folder-row:active{background:var(--panel);}
.folder-icon{width:44px; height:44px; border-radius:12px; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.folder-info{flex:1; min-width:0;}
.folder-name{font-family:var(--font-display); font-weight:600; font-size:15px;}
.folder-count{font-size:12.5px; color:var(--text-faint); margin-top:2px;}
.folder-chevron{color:var(--text-faint); flex-shrink:0;}
.folder-chevron svg{width:16px; height:16px;}
.contact-row{
  display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:14px; cursor:pointer;
  transition:background .15s;
}
.contact-row:active{background:var(--panel);}
.avatar{
  width:50px; height:50px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:17px; color:#fff;
  background:linear-gradient(135deg,var(--red-bright),var(--red-deep));
  position:relative;
}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.avatar .dot{
  position:absolute; bottom:0; left:0; width:12px; height:12px; border-radius:50%;
  background:#2fd15b; border:2px solid var(--bg);
}
.contact-info{flex:1; min-width:0;}
.contact-name{font-family:var(--font-display); font-weight:600; font-size:15.5px; margin-bottom:2px;}
.contact-preview{font-size:13px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.contact-meta{display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;}
.contact-time{font-size:11px; color:var(--text-faint);}
.unread-badge{
  min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:var(--red-bright);
  color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
}
.contact-row.unread .contact-name{color:#fff;}
.contact-row.unread .contact-preview{color:var(--text-dim); font-weight:500;}
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:60%; color:var(--text-faint); gap:10px; text-align:center; padding:20px;}
.empty-state svg{width:50px; height:50px; opacity:.35;}

.fab{
  position:absolute; bottom:22px; left:20px; width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,var(--red-bright),var(--red)); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(224,21,21,.4);
  z-index:5;
}
.fab svg{width:24px; height:24px;}

.self-profile{
  position:absolute; bottom:92px; left:20px; z-index:5; cursor:pointer;
}
.self-profile .avatar{
  width:52px; height:52px; font-size:18px; border:2px solid var(--red-bright);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.self-profile-cam{
  position:absolute; bottom:-2px; left:-2px; width:22px; height:22px; border-radius:50%;
  background:var(--red-bright); border:2px solid var(--bg); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.self-profile-cam svg{width:11px; height:11px;}

/* ---------- CHAT SCREEN ---------- */
.chat-header{
  display:flex; align-items:center; gap:10px; padding:14px 14px; border-bottom:1px solid var(--line);
  background:var(--bg2); flex-shrink:0;
}
.chat-header .avatar{width:38px; height:38px; font-size:14px;}
.chat-header-info{flex:1; min-width:0; cursor:pointer;}
.chat-header-name{font-family:var(--font-display); font-weight:600; font-size:15px;}
.chat-header-status{font-size:11.5px; color:var(--text-faint);}
.chat-actions{display:flex; gap:8px;}
#chatAvatar{cursor:pointer;}

/* ---------- CONTACT INFO SCREEN ---------- */
#contactInfoBody{flex:1; overflow-y:auto;}
.info-header{display:flex; flex-direction:column; align-items:center; padding:30px 20px 22px; text-align:center;}
.info-avatar{
  width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:38px; color:#fff;
  background:linear-gradient(135deg,var(--red-bright),var(--red-deep));
}
.info-avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.info-name{font-family:var(--font-display); font-weight:700; font-size:20px; margin-top:14px;}
.info-status{font-size:13px; color:var(--text-dim); margin-top:4px;}
.info-actions{display:flex; gap:18px; margin-top:22px;}
.info-action-btn{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); background:none; border:none; cursor:pointer; font-family:var(--font-body);}
.info-action-btn .circle{width:48px; height:48px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; border:1px solid var(--line);}
.info-action-btn .circle svg{width:19px; height:19px;}
.info-section{padding:16px 18px; border-top:1px solid var(--line);}
.info-section-title{font-size:12.5px; color:var(--text-faint); margin-bottom:10px; letter-spacing:.3px;}
.info-media-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.info-media-grid a{display:block; aspect-ratio:1; border-radius:8px; overflow:hidden;}
.info-media-grid img{width:100%; height:100%; object-fit:cover; display:block;}
.info-file-row{display:flex; align-items:center; gap:10px; padding:9px 0; text-decoration:none; color:inherit; border-bottom:1px solid var(--line);}
.info-file-row:last-child{border-bottom:none;}
.info-file-row .file-icon{font-size:22px;}
.info-file-row .file-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
.info-file-row .file-name{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.info-file-row .file-size{font-size:11px; color:var(--text-faint);}
.info-empty{font-size:12.5px; color:var(--text-faint); padding:6px 0;}

#messages{flex:1; overflow-y:auto; padding:14px 14px 10px; display:flex; flex-direction:column; gap:3px; background-size:cover; background-position:center; background-repeat:no-repeat;}
.msg-row{display:flex; max-width:100%;}
.msg-row.me{justify-content:flex-start;}
.msg-row.them{justify-content:flex-end;}
.bubble-col{display:flex; flex-direction:column; max-width:74%;}
.msg-row.them .bubble-col{align-items:flex-end;}
.sender-label{font-size:11px; font-weight:600; color:var(--red-bright); margin:0 6px 3px;}
.bubble{
  max-width:100%; padding:9px 13px; border-radius:16px; font-size:14.5px; line-height:1.5; position:relative;
  margin-bottom:6px; word-wrap:break-word;
}
.msg-row.me .bubble{background:var(--bubble-me); color:#fff; border-bottom-left-radius:5px;}
.msg-row.them .bubble{background:var(--bubble-them); color:var(--text); border-bottom-right-radius:5px; border:1px solid var(--line);}
.bubble .time{display:block; font-size:10px; opacity:.65; margin-top:4px; text-align:left;}

.voice-bubble{display:flex; align-items:center; gap:10px; min-width:170px;}
.voice-play{
  width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.18); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; color:inherit;
}
.msg-row.them .voice-play{background:rgba(255,80,80,.15);}
.voice-play svg{width:14px; height:14px;}
.voice-wave{flex:1; height:22px; display:flex; align-items:center; gap:2px;}
.voice-wave i{display:block; width:2.5px; border-radius:2px; background:currentColor; opacity:.55;}
.voice-dur{font-size:11px; opacity:.75; flex-shrink:0;}

.file-bubble{
  display:flex; align-items:center; gap:10px; min-width:190px; max-width:240px; text-decoration:none; color:inherit;
}
.file-icon{font-size:26px; flex-shrink:0;}
.file-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.file-name{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.file-size{font-size:11px; opacity:.7;}
.file-dl{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.file-dl svg{width:13px; height:13px;}
.msg-row.them .file-dl{background:rgba(255,80,80,.15);}
.file-bubble-img{padding:4px !important;}
.file-bubble-img img{max-width:220px; max-height:260px; border-radius:12px; display:block;}
.file-bubble-img video{max-width:240px; max-height:280px; border-radius:12px; display:block; background:#000;}
.file-bubble-img .time{padding:4px 6px 0;}
.msg-delete-btn{
  position:absolute; top:-8px; left:-8px; z-index:3; width:24px; height:24px; border-radius:50%;
  background:var(--red-bright); border:2px solid var(--bg); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.msg-delete-btn svg{width:12px; height:12px;}

.day-divider{align-self:center; font-size:11px; color:var(--text-faint); background:var(--panel); padding:4px 12px; border-radius:10px; margin:10px 0;}

/* ---------- SHOWCASE FEED ---------- */
#showcaseFeed{flex:1; overflow-y:auto; padding:14px 14px 40px; display:flex; flex-direction:column; gap:14px;}
.sc-card{
  background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden;
}
.sc-thumb{
  height:150px; display:flex; align-items:center; justify-content:center; position:relative;
  font-size:44px; overflow:hidden;
}
.sc-thumb::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(12,5,5,.55) 100%); z-index:1;}
.sc-type{
  position:absolute; top:10px; right:10px; z-index:2; font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:10px; background:rgba(12,5,5,.55); color:#fff; letter-spacing:.3px; backdrop-filter:blur(4px);
}
.sc-mine-tag{
  position:absolute; top:10px; left:10px; z-index:2; font-size:11px; font-weight:700; padding:4px 10px;
  border-radius:10px; background:var(--red-bright); color:#fff; letter-spacing:.3px;
}
.sc-play{
  position:absolute; z-index:2; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.92);
  display:flex; align-items:center; justify-content:center;
}
.sc-play svg{width:18px; height:18px; fill:var(--red);}
.sc-body{padding:13px 15px 15px;}
.sc-title{font-family:var(--font-display); font-weight:700; font-size:15.5px; margin-bottom:4px;}
.sc-desc{font-size:13px; color:var(--text-dim); line-height:1.5; margin-bottom:10px;}
.sc-foot{display:flex; align-items:center; gap:9px;}
.sc-foot .avatar{width:26px; height:26px; font-size:10.5px;}
.sc-creator{font-size:12.5px; color:var(--text-faint); flex:1;}
.sc-likes{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-faint);}
.sc-likes svg{width:14px; height:14px;}

/* ---------- INPUT BAR ---------- */
.input-bar{
  display:flex; align-items:flex-end; gap:8px; padding:10px 12px; background:var(--bg2);
  border-top:1px solid var(--line); flex-shrink:0;
}
.input-pill{
  flex:1; background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:10px 16px;
  display:flex; align-items:center; min-height:20px; max-height:100px; overflow-y:auto;
}
.input-pill textarea{
  width:100%; background:none; border:none; outline:none; resize:none; color:var(--text);
  font-family:var(--font-body); font-size:14.5px; line-height:1.4; max-height:80px;
}
.input-pill textarea::placeholder{color:var(--text-faint);}
.round-btn{
  width:42px; height:42px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; background:var(--panel); color:var(--text);
}
.round-btn.send{background:linear-gradient(135deg,var(--red-bright),var(--red)); color:#fff;}
.round-btn svg{width:18px; height:18px;}
.round-btn.mic.recording{background:var(--red-bright); animation:recpulse 1s infinite;}
@keyframes recpulse{0%{box-shadow:0 0 0 0 rgba(224,21,21,.6);} 70%{box-shadow:0 0 0 14px rgba(224,21,21,0);} 100%{box-shadow:0 0 0 0 rgba(224,21,21,0);}}

#recordingBar{
  display:none; align-items:center; gap:10px; padding:10px 16px; background:var(--bg2); border-top:1px solid var(--line);
  flex-shrink:0;
}
#recordingBar.show{display:flex;}
.rec-dot{width:10px; height:10px; border-radius:50%; background:var(--red-bright); animation:recpulse 1s infinite; flex-shrink:0;}
.rec-timer{font-family:var(--font-display); font-variant-numeric:tabular-nums; font-size:15px; flex:1;}
.rec-hint{font-size:12px; color:var(--text-faint);}
.rec-cancel{background:none; border:none; color:var(--red-bright); font-family:var(--font-body); font-size:13px; cursor:pointer; padding:6px 10px;}
.rec-send{
  width:38px; height:38px; border-radius:50%; background:var(--red-bright); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.rec-send svg{width:16px; height:16px;}

/* ---------- CALL SCREEN ---------- */
#callScreen{
  position:absolute; inset:0; z-index:60; display:none; flex-direction:column; align-items:center;
  background:radial-gradient(120% 100% at 50% 0%, #7a0000 0%, #1a0404 55%, #0c0505 100%);
  overflow:hidden;
}
#callScreen.show{display:flex;}
#callVideoBg{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none;
  transform:scaleX(-1); background:#000;
}
#callScreen.video-mode #callVideoBg{display:block;}
#callScreen.video-mode{background:#000;}
.call-content{
  position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;
  width:100%; height:100%; padding:60px 24px 40px; text-align:center;
}
#callScreen.video-mode .call-content{background:linear-gradient(180deg, rgba(12,5,5,.55) 0%, transparent 22%, transparent 70%, rgba(12,5,5,.6) 100%);}
.call-status{color:rgba(255,255,255,.7); font-size:14px; margin-top:6px; letter-spacing:.5px;}
.call-avatar{
  width:130px; height:130px; border-radius:50%; margin-top:50px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:44px; color:#fff;
  background:linear-gradient(135deg,var(--red-bright),var(--red-deep));
  box-shadow:0 0 0 0 rgba(224,21,21,.5); animation:ring 1.6s infinite;
}
.call-avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
#callScreen.video-mode .call-avatar{display:none;}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,21,21,.45);} 70%{box-shadow:0 0 0 30px rgba(224,21,21,0);} 100%{box-shadow:0 0 0 0 rgba(224,21,21,0);}}
.call-name{font-family:var(--font-display); font-weight:700; font-size:26px; margin-top:26px; text-shadow:0 2px 10px rgba(0,0,0,.4);}
#callScreen.video-mode .call-name{margin-top:14px;}
.call-timer{font-variant-numeric:tabular-nums; color:rgba(255,255,255,.75); margin-top:8px; font-size:15px; text-shadow:0 2px 10px rgba(0,0,0,.4);}
.call-controls{margin-top:auto; display:flex; gap:22px; align-items:center; flex-wrap:wrap; justify-content:center;}
.call-btn{
  width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.14); color:#fff;
}
.call-btn svg{width:24px; height:24px;}
.call-btn.end{background:var(--red-bright); width:70px; height:70px;}
.call-btn.active{background:#fff; color:#a80000;}

/* ---------- MODALS (SHEETS) ---------- */
#shareWorkModal, #myProfileModal{
  position:absolute; inset:0; z-index:55; display:none; align-items:flex-end; background:rgba(0,0,0,.55);
}
#shareWorkModal.show, #myProfileModal.show{display:flex;}
.sheet{
  width:100%; background:var(--panel); border-radius:22px 22px 0 0; padding:22px 20px 30px;
  animation:sheetup .28s ease;
}
@keyframes sheetup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet h2{font-family:var(--font-display); font-size:18px; margin:0 0 16px; text-align:center;}
.sheet input, .sheet select, .sheet textarea{
  width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:13px 16px;
  border-radius:13px; font-size:14.5px; font-family:var(--font-body); outline:none; margin-bottom:10px;
}
.sheet select{appearance:none; -webkit-appearance:none; cursor:pointer;}
.sheet textarea{resize:none; line-height:1.5;}
.switch-user-sec{margin-top:18px; border-top:1px solid var(--line); padding-top:14px;}
.switch-user-sec h3{
  font-family:var(--font-display); font-size:13.5px; font-weight:600; color:var(--text-dim);
  margin:0 0 10px; text-align:center;
}
.switch-user-list{max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.switch-user-row{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px;
  background:var(--panel2); border:1px solid var(--line); cursor:pointer;
}
.switch-user-row:active{opacity:.7;}
.switch-user-row .avatar{width:34px; height:34px; font-size:13px; flex-shrink:0;}
.switch-user-row .su-name{font-size:14px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.switch-user-empty{font-size:12.5px; color:var(--text-faint); text-align:center; padding:6px 2px;}
.add-user-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px;
  background:var(--panel2); border:1px dashed var(--line); color:var(--text-dim);
  padding:11px 14px; border-radius:12px; font-family:var(--font-body); font-size:13.5px; cursor:pointer;
}
.add-user-btn:active{opacity:.7;}
.add-user-btn svg{width:16px; height:16px; flex-shrink:0;}
.add-user-row{display:none; gap:8px; margin-top:8px;}
.add-user-row.show{display:flex;}
.add-user-row input{margin-bottom:0 !important; flex:1; min-width:0;}
.add-user-row button{
  flex-shrink:0; padding:0 16px; border:none; border-radius:12px; cursor:pointer;
  background:linear-gradient(135deg,var(--red-bright),var(--red)); color:#fff;
  font-family:var(--font-display); font-weight:600; font-size:13.5px;
}
.sheet input:focus, .sheet select:focus, .sheet textarea:focus{border-color:var(--red-bright);}
.sheet-buttons{display:flex; gap:10px; margin-top:8px;}
.sheet-buttons button{flex:1; padding:13px; border-radius:13px; border:none; font-family:var(--font-display); font-weight:600; font-size:14px; cursor:pointer;}
.sheet-buttons .cancel{background:var(--panel2); color:var(--text-dim);}
.sheet-buttons .confirm{background:linear-gradient(135deg,var(--red-bright),var(--red)); color:#fff;}

.gallery-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--panel2); border:1px dashed var(--line); color:var(--text-dim); padding:12px 16px;
  border-radius:13px; font-family:var(--font-body); font-size:13.5px; cursor:pointer; margin-bottom:10px;
}
.gallery-btn svg{width:17px; height:17px; flex-shrink:0;}
.gallery-btn.has-image{border-style:solid; border-color:var(--red-bright); color:var(--text);}
.img-preview-wrap{position:relative; margin-bottom:10px; border-radius:13px; overflow:hidden;}
.img-preview-wrap img{width:100%; max-height:150px; object-fit:cover; display:block; border-radius:13px;}
.img-preview-remove{
  position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:50%; border:none;
  background:rgba(12,5,5,.7); color:#fff; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.img-preview-wrap.round{width:88px; height:88px; margin:0 auto 10px; border-radius:50%;}
.img-preview-wrap.round img{width:100%; height:100%; max-height:none; border-radius:50%;}
.img-preview-wrap.round .img-preview-remove{top:-2px; left:-2px;}

/* ---------- TOAST NOTIFICATION ---------- */
#toastStack{
  position:absolute; top:0; left:0; right:0; z-index:80; display:flex; flex-direction:column;
  gap:8px; padding:10px; pointer-events:none;
}
.toast{
  pointer-events:auto; display:flex; align-items:center; gap:11px; background:rgba(28,13,13,.92);
  backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:16px; padding:11px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.4); cursor:pointer;
  transform:translateY(-120%); opacity:0; transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s;
}
.toast.in{transform:translateY(0); opacity:1;}
.toast .avatar{width:38px; height:38px; font-size:14px;}
.toast-body{flex:1; min-width:0;}
.toast-name{font-family:var(--font-display); font-weight:600; font-size:13.5px;}
.toast-text{font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

::-webkit-scrollbar{width:0; height:0;}

.visually-hidden-input{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0; opacity:0;
}
</style>

      <div id="myProfileAvatarPreviewWrap" class="img-preview-wrap round" style="display:none;">
        <img id="myProfileAvatarPreview" alt="תצוגה מקדימה">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>הוספת משתמש</span>
        </button>

          <input id="addUserName" type="text" placeholder="שם המשתמש החדש" maxlength="20">
          <button type="button" id="addUserConfirm">הוספה</button>

</div>

<script>
(function(){
  // ====== BACKEND ======
  // Data is stored in Neon (Postgres) via Vercel serverless functions under /api/*.
  async function api(path, opts){
    const res = await fetch('/api/'+path, {
      headers: {'Content-Type': 'application/json'},
      ...opts,
    });
    if(!res.ok){
      let body = null;
      try{ body = await res.json(); }catch(e){}
      throw new Error((body && body.error) || ('request failed: '+res.status));
    }
    if(res.status===204) return null;
    return res.json();
  }
  const apiGet = (path) => api(path);
  const apiPost = (path, data) => api(path, {method:'POST', body: JSON.stringify(data)});
  const apiPatch = (path, data) => api(path, {method:'PATCH', body: JSON.stringify(data)});
  const apiDelete = (path) => api(path, {method:'DELETE'});

  const LS_USER_ID = 'parliament_user_id';
  const LS_USER = 'parliament_user';
  const LS_SELF_AVATAR = 'parliament_self_avatar';

  // `me` is the current user's row {id, name, avatar}. Chat is strictly user-to-user:
  // there is no separate "contacts" concept — the people list below IS the users table.
  let me = null;
  const storedUserId = localStorage.getItem(LS_USER_ID);
  if(storedUserId){
    me = {
      id: Number(storedUserId),
      name: localStorage.getItem(LS_USER) || '',
      avatar: localStorage.getItem(LS_SELF_AVATAR) || null,
    };
  }

  let users = [];          // everyone except me, id -> row
  let currentChat = null;  // the user object I'm chatting with
  let mediaRecorder = null, recChunks = [], recStart = 0, recTimerInt = null, recStream = null;
  let callTimerInt = null, callSeconds = 0, callTargetName = '';
  const messagesCache = {}; // user_id -> rendered message objects
  const lastPreview = {};   // user_id -> {text, time, ts}

  function initials(name){
    const parts = (name||'').trim().split(' ').filter(Boolean);
    if(parts.length>=2) return parts[0][0]+parts[1][0];
    return (name||'?').slice(0,2);
  }

  function avatarInner(u){
    if(u && u.avatar) return `<img src="${u.avatar}" alt="">`;
    return initials((u && u.name) || (u && u.creator) || '?');
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  }

  function rowToMsg(row){
    return {
      id: row.id,
      senderId: row.sender_id,
      recipientId: row.recipient_id,
      from: row.sender_id === me.id ? 'me' : 'them',
      type: row.type,
      text: row.content,
      audio: row.audio_data,
      duration: row.duration,
      fileName: row.file_name,
      fileSize: row.file_size,
      mimeType: row.mime_type,
      fileData: row.file_data,
      ts: new Date(row.created_at).getTime()
    };
  }

  function msgPreviewText(m){
    if(m.type==='voice') return '🎙️ הודעה קולית';
    if(m.type==='file'){
      if((m.mimeType||'').startsWith('video/')) return '🎬 '+(m.fileName||'סרטון');
      if((m.mimeType||'').startsWith('image/')) return '🖼️ '+(m.fileName||'תמונה');
      return '📎 '+(m.fileName||'קובץ');
    }
    return m.text;
  }

  function fmtFileSize(bytes){
    if(!bytes) return '';
    if(bytes < 1024) return bytes+' B';
    if(bytes < 1024*1024) return Math.round(bytes/1024)+' KB';
    return (bytes/(1024*1024)).toFixed(1)+' MB';
  }

  async function fetchMessages(otherId){
    let data;
    try{
      data = await apiGet('messages?user_id='+me.id+'&with_id='+otherId);
    }catch(err){
      console.error(err);
      return [];
    }
    const msgs = data.map(rowToMsg);
    messagesCache[otherId] = msgs;
    if(msgs.length){
      const last = msgs[msgs.length-1];
      lastPreview[otherId] = {text: msgPreviewText(last), time: fmtTime(last.ts), ts:last.ts};
    }
    return msgs;
  }

  async function insertMessage(recipientId, payload){
    const row = {
      sender_id: me.id, recipient_id: recipientId, type: payload.type,
      content: payload.text || null, audio_data: payload.audio || null, duration: payload.duration || null,
      file_name: payload.fileName || null, file_size: payload.fileSize || null, mime_type: payload.mimeType || null, file_data: payload.fileData || null
    };
    try{
      const data = await apiPost('messages', row);
      return rowToMsg(data);
    }catch(err){
      console.error(err);
      alert('שגיאה בשליחה - ' + (payload.type==='file' ? 'ייתכן שהקובץ כבד מדי לשרת. ' : '') + 'בדוק/י את חיבור ה-DB.');
      return null;
    }
  }

  async function deleteMessage(otherId, m){
    if(m.id==null) return;
    const label = m.type==='voice' ? 'ההודעה הקולית' : m.type==='file' ? 'הקובץ' : 'ההודעה';
    if(!confirm('למחוק את '+label+'?')) return;
    const arr = messagesCache[otherId] || [];
    const idx = arr.findIndex(x=> x.id===m.id);
    if(idx>-1) arr.splice(idx,1);
    try{
      await apiDelete('messages?id='+encodeURIComponent(m.id));
    }catch(err){
      console.error(err);
      alert('שגיאה במחיקה - בדוק/י את חיבור ה-DB');
    }
    if(arr.length){
      const last = arr[arr.length-1];
      lastPreview[otherId] = {text: msgPreviewText(last), time: fmtTime(last.ts), ts:last.ts};
    } else {
      delete lastPreview[otherId];
    }
    renderMessages();
    renderUserList();
  }

  // ---------- UNREAD / NOTIFICATIONS ----------
  const LS_UNREAD = 'parliament_unread';
  const LS_NOTIF_PREF = 'parliament_notif_on';
  let unread = JSON.parse(localStorage.getItem(LS_UNREAD) || '{}');
  let notifOn = localStorage.getItem(LS_NOTIF_PREF) === '1';

  function saveUnread(){ localStorage.setItem(LS_UNREAD, JSON.stringify(unread)); }

  function markRead(otherId){
    if(unread[otherId]){ delete unread[otherId]; saveUnread(); renderUserList(); }
  }

  function playPing(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(560, ctx.currentTime+.18);
      g.gain.setValueAtTime(.14, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+.33);
    }catch(e){}
  }

  function showToast(user, text){
    const stack = document.getElementById('toastStack');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<div class="avatar">${avatarInner(user)}</div>
      <div class="toast-body">
        <div class="toast-name">${escapeHtml(user.name)}</div>
        <div class="toast-text">${escapeHtml(text)}</div>
      </div>`;
    t.addEventListener('click', ()=>{
      t.remove();
      document.getElementById('chatScreen').classList.contains('open') && currentChat && currentChat.id===user.id ? null : openChat(user);
    });
    stack.appendChild(t);
    requestAnimationFrame(()=> t.classList.add('in'));
    setTimeout(()=>{
      t.classList.remove('in');
      setTimeout(()=> t.remove(), 350);
    }, 3800);
  }

  function sendBrowserNotification(user, text){
    if(!notifOn || !('Notification' in window) || Notification.permission!=='granted') return;
    if(document.visibilityState==='visible') return;
    try{
      const n = new Notification('פרלמנט · '+user.name, {body:text, tag:'parliament-'+user.id});
      n.onclick = ()=>{ window.focus(); n.close(); };
    }catch(e){}
  }

  async function toggleNotifPerm(){
    if(!('Notification' in window)){
      alert('הדפדפן הזה לא תומך בהתראות.');
      return;
    }
    if(!window.isSecureContext){
      alert('התראות עובדות רק כשהאתר רץ בכתובת מאובטחת (https) - כשפותחים את הקובץ ישירות (file://) הדפדפן חוסם את זה. תעלה את הקובץ לאינטרנט ותיכנס דרך הקישור https.');
      return;
    }
    if(notifOn){
      notifOn = false;
      localStorage.setItem(LS_NOTIF_PREF, '0');
      updateNotifBtn();
      return;
    }
    let perm = Notification.permission;
    if(perm === 'denied'){
      alert('הגישה להתראות נחסמה בעבר. כדי לאשר מחדש יש לפתוח את הגדרות האתר בדפדפן (לחיצה על סמל המנעול/המידע ליד כתובת האתר) ולשנות שם את ההרשאה להתראות.');
      return;
    }
    if(perm === 'default'){
      perm = await Notification.requestPermission();
    }
    if(perm === 'granted'){
      notifOn = true;
      localStorage.setItem(LS_NOTIF_PREF, '1');
      showToast({id:'system', name:'פרלמנט'}, 'התראות הופעלו בהצלחה 🔔');
    } else {
      notifOn = false;
      localStorage.setItem(LS_NOTIF_PREF, '0');
      alert('לא אושרה הרשאה להתראות. ניתן לאשר דרך הגדרות הדפדפן.');
    }
    updateNotifBtn();
  }

  function updateNotifBtn(){
    const btn = document.getElementById('btnNotifPerm');
    const dot = document.getElementById('notifDot');
    btn.classList.toggle('notif-on', notifOn);
    dot.style.display = notifOn ? 'none' : 'block';
  }

  /* ---------- THEME ---------- */
  const LS_THEME = 'parliament_theme';
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(LS_THEME, t);
  }
  document.getElementById('btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'light' ? 'dark' : 'light');
  });

  document.getElementById('btnNotifPerm').addEventListener('click', toggleNotifPerm);

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && currentChat && document.getElementById('chatScreen').classList.contains('open')){
      markRead(currentChat.id);
    }
  });

  // Delivers an incoming message to a user's thread, handling read-state & notifications.
  function deliverMsg(user, msg){
    if(!messagesCache[user.id]) messagesCache[user.id] = [];
    messagesCache[user.id].push(msg);
    lastPreview[user.id] = {text: msgPreviewText(msg), time: fmtTime(msg.ts), ts: msg.ts};

    const chatOpenAndVisible = currentChat && currentChat.id===user.id
      && document.getElementById('chatScreen').classList.contains('open')
      && document.visibilityState==='visible';

    if(chatOpenAndVisible){
      renderMessages();
    } else {
      unread[user.id] = (unread[user.id]||0)+1;
      saveUnread();
      renderUserList();
      const preview = msgPreviewText(msg);
      showToast(user, preview);
      sendBrowserNotification(user, preview);
      playPing();
    }
  }

  // ---------- REALTIME (polling) ----------
  // Neon has no browser-safe realtime channel, so we poll periodically instead:
  // the open chat thread refreshes often, the user list (for previews) less often.
  let pollChatInt = null, pollListInt = null;

  async function pollOpenChat(){
    if(!currentChat || !document.getElementById('chatScreen').classList.contains('open')) return;
    const otherId = currentChat.id;
    const prevCount = (messagesCache[otherId]||[]).length;
    const msgs = await fetchMessages(otherId);
    if(msgs.length > prevCount){
      const newOnes = msgs.slice(prevCount).filter(m=> m.senderId !== me.id);
      renderMessages();
      newOnes.forEach(m=> deliverMsg(currentChat, m));
      markRead(otherId);
    }
  }

  async function pollUserListPreviews(){
    if(document.getElementById('chatScreen').classList.contains('open')) return;
    await loadUsers();
    renderUserList();
  }

  function subscribeRealtime(){
    if(pollChatInt) clearInterval(pollChatInt);
    if(pollListInt) clearInterval(pollListInt);
    pollChatInt = setInterval(pollOpenChat, 3000);
    pollListInt = setInterval(pollUserListPreviews, 6000);
  }

  // ---------- INIT / ONBOARDING ----------
  async function loadUsers(){
    let data;
    try{
      data = await apiGet('users');
    }catch(err){
      console.error(err);
      users = [];
      return;
    }
    users = data.filter(u=> u.id !== me.id);
    // fetch last-message previews for the list
    await Promise.all(users.map(u=> fetchMessages(u.id)));
  }

  async function registerUser(name, avatar){
    if(!name) return null;
    try{
      return await apiPost('users', {name, avatar});
    }catch(err){ console.error(err); return null; }
  }

  function renderSelfAvatar(){
    const el = document.getElementById('selfAvatar');
    if(el) el.innerHTML = avatarInner({name: me.name, avatar: me.avatar});
  }

  function saveMe(){
    localStorage.setItem(LS_USER_ID, String(me.id));
    localStorage.setItem(LS_USER, me.name);
    if(me.avatar){ localStorage.setItem(LS_SELF_AVATAR, me.avatar); }
    else{ localStorage.removeItem(LS_SELF_AVATAR); }
  }

  async function enterApp(){
    document.getElementById('onboard').classList.remove('show');
    document.getElementById('contactsScreen').style.display = 'flex';
    document.getElementById('contactList').innerHTML = '<div class="empty-state"><div>טוען...</div></div>';
    renderSelfAvatar();
    await loadUsers();
    renderUserList();
    subscribeRealtime();
  }

  async function renderOnboardUserList(){
    const wrap = document.getElementById('obUserList');
    const divider = document.getElementById('obDivider');
    wrap.innerHTML = '<div style="font-size:13px; color:var(--text-faint); padding:6px 2px;">טוען משתמשים...</div>';
    let all;
    try{
      all = await apiGet('users');
    }catch(err){
      console.error(err);
      wrap.innerHTML = '';
      divider.style.display = 'none';
      return;
    }
    if(!all.length){
      wrap.innerHTML = '';
      divider.style.display = 'none';
      return;
    }
    divider.style.display = 'flex';
    wrap.innerHTML = '';
    all.forEach(u=>{
      const row = document.createElement('div');
      row.className = 'ob-user-row';
      row.innerHTML = `
        <div class="avatar">${avatarInner(u)}</div>
        <div class="ob-user-name">${escapeHtml(u.name)}</div>`;
      row.addEventListener('click', async ()=>{
        me = {id: u.id, name: u.name, avatar: u.avatar};
        saveMe();
        await registerUser(me.name, me.avatar);
        await enterApp();
      });
      wrap.appendChild(row);
    });
  }

  function boot(){
    updateNotifBtn();
    setTimeout(()=>{
      document.getElementById('splash').classList.add('hide');
      setTimeout(async ()=>{
        if(!me){
          document.getElementById('onboard').classList.add('show');
          renderOnboardUserList();
        } else {
          await enterApp();
        }
      }, 620);
    }, 1200);
  }

  document.getElementById('obStart').addEventListener('click', async ()=>{
    const val = document.getElementById('obName').value.trim();
    if(!val){ alert('צריך לבחור משתמש קיים או להקליד שם חדש.'); return; }
    const user = await registerUser(val, null);
    if(!user){ alert('שגיאה בהתחברות - בדוק/י את חיבור ה-DB'); return; }
    me = {id: user.id, name: user.name, avatar: user.avatar};
    saveMe();
    await enterApp();
  });

  // ---------- USER LIST ----------
  function lastMsgPreview(otherId){
    return lastPreview[otherId] || {text:'התחל/י שיחה', time:''};
  }

  function renderUserList(filter){
    const list = document.getElementById('contactList');
    list.innerHTML = '';
    const q = (filter||'').trim();
    const shown = users.filter(u => !q || u.name.includes(q));
    if(shown.length===0){
      list.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <div>עדיין אין משתמשים אחרים - כשמישהו יצטרף, הוא/היא יופיעו כאן.</div>
      </div>`;
      return;
    }
    shown.forEach(u=>{
      const prev = lastMsgPreview(u.id);
      const count = unread[u.id]||0;
      const row = document.createElement('div');
      row.className = 'contact-row' + (count>0 ? ' unread':'');
      row.innerHTML = `
        <div class="avatar">${avatarInner(u)}<span class="dot"></span></div>
        <div class="contact-info">
          <div class="contact-name">${escapeHtml(u.name)}</div>
          <div class="contact-preview">${escapeHtml(prev.text)}</div>
        </div>
        <div class="contact-meta">
          <div class="contact-time">${prev.time}</div>
          ${count>0 ? `<div class="unread-badge">${count>9?'9+':count}</div>` : ''}
        </div>`;
      row.addEventListener('click', ()=> openChat(u));
      list.appendChild(row);
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  document.getElementById('searchInput').addEventListener('input', e=>{
    renderUserList(e.target.value);
  });

  // ---------- IMAGE PICKER HELPER ----------
  function compressImageFile(file, maxDim, quality){
    maxDim = maxDim || 400; quality = quality || 0.75;
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{
        URL.revokeObjectURL(url);
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        try{
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  function setupImagePicker(fileId, btnId, wrapId, imgId, removeId){
    const fileEl = document.getElementById(fileId);
    const btnEl = document.getElementById(btnId);
    const wrapEl = document.getElementById(wrapId);
    const imgEl = document.getElementById(imgId);
    const removeEl = document.getElementById(removeId);
    let data = null;
    function reset(existing){
      data = existing || null;
      fileEl.value = '';
      if(data){
        imgEl.src = data;
        wrapEl.style.display = 'block';
        btnEl.style.display = 'none';
      } else {
        wrapEl.style.display = 'none';
        btnEl.style.display = 'flex';
      }
    }
    btnEl.addEventListener('click', ()=> fileEl.click());
    fileEl.addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        data = await compressImageFile(file, 400, 0.75);
        imgEl.src = data;
        wrapEl.style.display = 'block';
        btnEl.style.display = 'none';
      }catch(err){
        console.error(err);
        alert('שגיאה בעיבוד התמונה. נסה/י תמונה אחרת.');
      }
    });
    removeEl.addEventListener('click', ()=> reset(null));
    return { getData: ()=> data, reset };
  }

  // ---------- CHAT SCREEN ----------
  async function openChat(u){
    currentChat = u;

  function renderMessages(){
    const wrap = document.getElementById('messages');
    wrap.innerHTML = '';
    const msgs = messagesCache[currentChat.id] || [];
    let lastDay = null;
    msgs.forEach(m=>{
      const day = new Date(m.ts).toDateString();
      if(day !== lastDay){
        const div = document.createElement('div');
        div.className = 'day-divider';
        div.textContent = new Date(m.ts).toLocaleDateString('he-IL', {day:'numeric', month:'long'});
        wrap.appendChild(div);
        lastDay = day;
      }
      wrap.appendChild(renderBubble(m));
    });
    wrap.scrollTop = wrap.scrollHeight;
  }

  function fileIconFor(mime, name){
    const ext = (name||'').split('.').pop().toLowerCase();
    if((mime||'').startsWith('image/')) return '🖼️';
    if((mime||'').startsWith('video/')) return '🎬';
    if((mime||'').startsWith('audio/')) return '🎵';
    if(ext==='pdf') return '📕';
    if(['doc','docx'].includes(ext)) return '📄';
    if(['xls','xlsx','csv'].includes(ext)) return '📊';
    if(['zip','rar','7z'].includes(ext)) return '🗜️';
    return '📎';
  }

  function renderBubble(m){
    const row = document.createElement('div');
    const mine = m.from==='me';
    row.className = 'msg-row ' + (mine ? 'me':'them');
    let bubbleHtml = '';
    if(m.type==='voice'){
      const bars = Array.from({length:20}, ()=> 4+Math.round(Math.random()*14));
      bubbleHtml = `<div class="bubble">
        <div class="voice-bubble">
          <button class="voice-play" data-audio="${m.audio||''}">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="voice-wave">${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}</div>
          <div class="voice-dur">${m.duration||'0:0'}</div>
        </div>
        <span class="time">${fmtTime(m.ts)}</span>
      </div>`;
    } else if(m.type==='file'){
      const isImage = (m.mimeType||'').startsWith('image/');
      const isVideo = (m.mimeType||'').startsWith('video/');
      const canDelete = mine && m.id!=null;
      const delBtn = canDelete ? `<button class="msg-delete-btn" title="מחיקה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>` : '';
      if(isImage && m.fileData){
        bubbleHtml = `<div class="bubble file-bubble-img">
          ${delBtn}
          <a href="${m.fileData}" download="${escapeHtml(m.fileName||'image')}">
            <img src="${m.fileData}" alt="${escapeHtml(m.fileName||'')}">
          </a>
          <span class="time">${fmtTime(m.ts)}</span>
        </div>`;
      } else if(isVideo && m.fileData){
        bubbleHtml = `<div class="bubble file-bubble-img">
          ${delBtn}
          <video src="${m.fileData}" controls preload="metadata"></video>
          <span class="time">${fmtTime(m.ts)}</span>
        </div>`;
      } else {
        bubbleHtml = `<div class="bubble">
          ${delBtn}
          <a class="file-bubble" href="${m.fileData||'#'}" download="${escapeHtml(m.fileName||'file')}">
            <span class="file-icon">${fileIconFor(m.mimeType, m.fileName)}</span>
            <span class="file-info">
              <span class="file-name">${escapeHtml(m.fileName||'קובץ')}</span>
              <span class="file-size">${fmtFileSize(m.fileSize)}</span>
            </span>
            <span class="file-dl">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            </span>
          </a>
          <span class="time">${fmtTime(m.ts)}</span>
        </div>`;
      }
    } else {
      bubbleHtml = `<div class="bubble">${escapeHtml(m.text)}<span class="time">${fmtTime(m.ts)}</span></div>`;
    }
    row.innerHTML = `<div class="bubble-col">${bubbleHtml}</div>`;
    if(m.type==='voice' && m.audio){
      const btn = row.querySelector('.voice-play');
      btn.addEventListener('click', ()=>{
        const audio = new Audio(m.audio);
        audio.play();
      });
    }
    const delBtnEl = row.querySelector('.msg-delete-btn');
    if(delBtnEl){
      delBtnEl.addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        deleteMessage(currentChat.id, m);
      });
    }
    return row;
  }


  async function addMessage(payload){
    const target = currentChat;
    const optimistic = {
      from:'me', senderId: me.id, recipientId: target.id, type:payload.type, text:payload.text, audio:payload.audio, duration:payload.duration,
      fileName:payload.fileName, fileSize:payload.fileSize, mimeType:payload.mimeType, fileData:payload.fileData,
      ts: Date.now()
    };
    if(!messagesCache[target.id]) messagesCache[target.id] = [];
    messagesCache[target.id].push(optimistic);
    lastPreview[target.id] = {text: msgPreviewText(optimistic), time: fmtTime(optimistic.ts), ts: optimistic.ts};
    renderMessages();
    const saved = await insertMessage(target.id, payload);
    if(saved && saved.id!=null){
      optimistic.id = saved.id;
      renderMessages();
    } else {
      // persistence failed - remove the optimistic bubble so it doesn't look like it sent
      const arr = messagesCache[target.id] || [];
      const idx = arr.indexOf(optimistic);
      if(idx>-1) arr.splice(idx,1);
      if(arr.length){
        const last = arr[arr.length-1];
        lastPreview[target.id] = {text: msgPreviewText(last), time: fmtTime(last.ts), ts:last.ts};
      } else {
        delete lastPreview[target.id];
      }
      renderMessages();
      renderUserList();
    }
  }

  // ---------- TEXT INPUT ----------

  const msgInput = document.getElementById('msgInput');
  const btnSend = document.getElementById('btnSend');
  const btnMic = document.getElementById('btnMic');

  msgInput.addEventListener('input', ()=>{
    msgInput.style.height='auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight,80)+'px';
    const has = msgInput.value.trim().length>0;
    btnSend.style.display = has ? 'flex':'none';
    btnMic.style.display = has ? 'none':'flex';
  });

  function sendText(){
    const val = msgInput.value.trim();
    if(!val) return;
    addMessage({type:'text', text:val});
    msgInput.value=''; msgInput.style.height='auto';
    btnSend.style.display='none'; btnMic.style.display='flex';
  }
  btnSend.addEventListener('click', sendText);
  msgInput.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });

  // ---------- VOICE RECORDING ----------
  async function startRecording(){
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert('גישה למיקרופון עובדת רק כשהאתר רץ בכתובת מאובטחת (https) - כשפותחים את הקובץ ישירות (file://) הדפדפן חוסם את זה. תעלה את הקובץ לאינטרנט ותיכנס דרך הקישור https.');
      return;
    }
    try{
      recStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(err){
      alert('לא ניתן לגשת למיקרופון. יש לאשר הרשאת מיקרופון בדפדפן.');
      return;
    }
    recChunks = [];
    mediaRecorder = new MediaRecorder(recStream);
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recChunks.push(e.data); };
    mediaRecorder.start();
    recStart = Date.now();
    document.getElementById('inputBar').style.display='none';
    document.getElementById('recordingBar').classList.add('show');
    updateRecTimer();
    recTimerInt = setInterval(updateRecTimer, 200);
  }

  function updateRecTimer(){
    const secs = Math.floor((Date.now()-recStart)/1000);
    const m = Math.floor(secs/60), s = secs%60;
    document.getElementById('recTimer').textContent = m+':'+s.toString().padStart(2,'0');
  }

  function stopRecording(send){
    clearInterval(recTimerInt);
    document.getElementById('recordingBar').classList.remove('show');
    document.getElementById('inputBar').style.display='flex';
    if(!mediaRecorder) return;
    const durSecs = Math.floor((Date.now()-recStart)/1000);
    mediaRecorder.onstop = ()=>{
      if(recStream){ recStream.getTracks().forEach(t=>t.stop()); }
      if(send && recChunks.length){
        const blob = new Blob(recChunks, {type:'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = ()=>{
          const m = Math.floor(durSecs/60), s = durSecs%60;
          addMessage({type:'voice', audio: reader.result, duration: m+':'+s.toString().padStart(2,'0')});
        };
        reader.readAsDataURL(blob);
      }
    };
    mediaRecorder.stop();
  }

  btnMic.addEventListener('click', startRecording);
  document.getElementById('recCancel').addEventListener('click', ()=> stopRecording(false));
  document.getElementById('recSend').addEventListener('click', ()=> stopRecording(true));

  // ---------- FILE SHARING ----------
  const MAX_FILE_MB = 20;
  document.getElementById('btnAttach').addEventListener('click', ()=>{
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file || !currentChat){ e.target.value=''; return; }
    if(file.size > MAX_FILE_MB*1024*1024){
      alert('הקובץ גדול מדי (מקסימום '+MAX_FILE_MB+'MB). לסרטונים ארוכים, כדאי לשלוח קליפ קצר יותר.');
      e.target.value='';
      return;
    }
    e.target.value='';
    const isImage = (file.type||'').startsWith('image/');
    try{
      let fileData;
      if(isImage){
        fileData = await compressImageFile(file, 1000, 0.8);
      } else {
        fileData = await new Promise((resolve, reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }
      await addMessage({type:'file', fileName:file.name, fileSize:file.size, mimeType:file.type, fileData});
    }catch(err){
      console.error(err);
      alert('שגיאה בשליחת הקובץ.');
    }
  });

  // ---------- CALLS ----------
  let callStream = null;
  let isVideoCall = false;
  let camOn = true;

  function formatCallTime(s){
    const m = Math.floor(s/60), sec = s%60;
    return m.toString().padStart(2,'0')+':'+sec.toString().padStart(2,'0');
  }

  async function startCall(video){
    if(!currentChat) return;
    isVideoCall = !!video;
    callTargetName = currentChat.name;
    document.getElementById('callAvatar').innerHTML = avatarInner(currentChat);
    document.getElementById('callName').textContent = callTargetName;
    document.getElementById('callStatusText').textContent = 'מתקשר/ת...';
    document.getElementById('callTimer').textContent = '00:00';
    document.getElementById('callScreen').classList.toggle('video-mode', isVideoCall);
    document.getElementById('btnCamToggle').style.display = isVideoCall ? 'flex' : 'none';
    document.getElementById('btnSpeaker').style.display = isVideoCall ? 'none' : 'flex';
    document.getElementById('callScreen').classList.add('show');
    callSeconds = 0;
    camOn = true;

    if(isVideoCall){
      if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert('גישה למצלמה עובדת רק כשהאתר רץ בכתובת מאובטחת (https) - כשפותחים את הקובץ ישירות מהמחשב/טלפון (file://) הדפדפן חוסם את זה. תעלה את הקובץ לאינטרנט (Netlify/Vercel וכו׳) ותיכנס דרך הקישור https - אז זה יעבוד.');
        endCall();
        return;
      }
      try{
        callStream = await navigator.mediaDevices.getUserMedia({audio:true, video:{facingMode:'user'}});
      }catch(err1){
        // retry with a plain constraint in case facingMode isn't supported on this device
        try{
          callStream = await navigator.mediaDevices.getUserMedia({audio:true, video:true});
        }catch(err){
          let msg = 'לא ניתן לגשת למצלמה/מיקרופון.';
          if(err.name==='NotAllowedError') msg = 'ההרשאה למצלמה/מיקרופון נדחתה. יש ללחוץ על סמל המנעול ליד כתובת האתר בדפדפן, לפתוח שם הרשאות, ולאשר מצלמה + מיקרופון לאתר הזה. אחרי זה לרענן את הדף ולנסות שוב.';
          else if(err.name==='NotFoundError') msg = 'לא נמצאה מצלמה במכשיר הזה.';
          else if(err.name==='NotReadableError') msg = 'המצלמה תפוסה על ידי אפליקציה אחרת. תסגור אפליקציות אחרות שמשתמשות במצלמה ותנסה שוב.';
          alert(msg + '\n\n(פרטי שגיאה: ' + err.name + ')');
          endCall();
          return;
        }
      }
      document.getElementById('callVideoBg').srcObject = callStream;
    }

    setTimeout(()=>{
      if(!document.getElementById('callScreen').classList.contains('show')) return;
      document.getElementById('callStatusText').textContent = 'שיחה מתקיימת';
      callTimerInt = setInterval(()=>{
        callSeconds++;
        document.getElementById('callTimer').textContent = formatCallTime(callSeconds);
      }, 1000);
    }, 2200);
  }

  function endCall(){
    clearInterval(callTimerInt);
    document.getElementById('callScreen').classList.remove('show');
    document.getElementById('callScreen').classList.remove('video-mode');
    if(callStream){
      callStream.getTracks().forEach(t=>t.stop());
      callStream = null;
    }
    document.getElementById('callVideoBg').srcObject = null;
    if(currentChat && callSeconds>0){
      const label = isVideoCall ? '📹 שיחת וידאו · ' : '📞 שיחה קולית · ';
      addMessage({type:'text', text:label+formatCallTime(callSeconds)});
    }
  }

  document.getElementById('btnVoiceCall').addEventListener('click', ()=> startCall(false));
  document.getElementById('btnVideoCall').addEventListener('click', ()=> startCall(true));
  document.getElementById('btnEndCall').addEventListener('click', endCall);

  let muted = false;
  document.getElementById('btnMute').addEventListener('click', function(){
    muted = !muted;
    this.classList.toggle('active', muted);
    if(callStream) callStream.getAudioTracks().forEach(t=> t.enabled = !muted);
  });
  let speakerOn = false;
  document.getElementById('btnSpeaker').addEventListener('click', function(){
    speakerOn = !speakerOn;
    this.classList.toggle('active', speakerOn);
  });
  document.getElementById('btnCamToggle').addEventListener('click', function(){
    camOn = !camOn;
    this.classList.toggle('active', !camOn);
    if(callStream) callStream.getVideoTracks().forEach(t=> t.enabled = camOn);
  });

  const myProfilePicker = setupImagePicker('myProfileAvatarFile','myProfileAvatarBtn','myProfileAvatarPreviewWrap','myProfileAvatarPreview','myProfileAvatarRemove');

  async function switchUser(u){
    // close any open screens and stop polling for the previous identity
    if(pollChatInt){ clearInterval(pollChatInt); pollChatInt = null; }
    if(pollListInt){ clearInterval(pollListInt); pollListInt = null; }
    currentChat = null;
    document.getElementById('chatScreen').classList.remove('open');
    document.getElementById('contactInfoScreen').classList.remove('open');
    document.getElementById('showcaseScreen').classList.remove('open');
    document.getElementById('allFilesScreen').classList.remove('open');
    document.getElementById('myProfileModal').classList.remove('show');

    // unread counters belong to the previous user
    unread = {};
    saveUnread();

    me = {id: u.id, name: u.name, avatar: u.avatar};
    saveMe();
    await enterApp();
  }

  async function renderSwitchUserList(){
    const wrap = document.getElementById('switchUserList');
    wrap.innerHTML = '<div class="switch-user-empty">טוען משתמשים...</div>';
    let all;
    try{
      all = await apiGet('users');
    }catch(err){
      console.error(err);
      wrap.innerHTML = '<div class="switch-user-empty">שגיאה בטעינת המשתמשים</div>';
      return;
    }
    const others = all.filter(u=> u.id !== me.id);
    if(!others.length){
      wrap.innerHTML = '<div class="switch-user-empty">אין משתמשים אחרים</div>';
      return;
    }
    wrap.innerHTML = '';
    others.forEach(u=>{
      const row = document.createElement('div');
      row.className = 'switch-user-row';
      row.innerHTML = `
        <div class="avatar">${avatarInner(u)}</div>
        <div class="su-name">${escapeHtml(u.name)}</div>`;
      row.addEventListener('click', ()=> switchUser(u));
      wrap.appendChild(row);
    });
  }

  function openMyProfileModal(){
    document.getElementById('myProfileName').value = me.name || '';
    myProfilePicker.reset(me.avatar || null);
    document.getElementById('myProfileModal').classList.add('show');
    document.getElementById('addUserRow').classList.remove('show');
    document.getElementById('addUserBtn').style.display = '';
    document.getElementById('addUserName').value = '';
    renderSwitchUserList();
  }
  const addUserRow = document.getElementById('addUserRow');
  const addUserNameEl = document.getElementById('addUserName');

  document.getElementById('addUserBtn').addEventListener('click', ()=>{
    addUserRow.classList.add('show');
    document.getElementById('addUserBtn').style.display = 'none';
    addUserNameEl.focus();
  });

  async function confirmAddUser(){
    const name = addUserNameEl.value.trim();
    if(!name){ alert('צריך להקליד שם.'); return; }
    const user = await registerUser(name, null);
    if(!user){ alert('שגיאה ביצירת המשתמש - בדוק/י את חיבור ה-DB'); return; }
    addUserNameEl.value = '';
    await switchUser(user);
  }
  document.getElementById('addUserConfirm').addEventListener('click', confirmAddUser);
  addUserNameEl.addEventListener('keydown', e=>{ if(e.key === 'Enter') confirmAddUser(); });

  document.getElementById('btnProfile').addEventListener('click', openMyProfileModal);
  document.getElementById('selfProfileBtn').addEventListener('click', openMyProfileModal);

  document.getElementById('myProfileCancel').addEventListener('click', ()=>{
    document.getElementById('myProfileModal').classList.remove('show');
  });
  document.getElementById('myProfileConfirm').addEventListener('click', async ()=>{
    const newName = document.getElementById('myProfileName').value.trim();
    if(!newName){ alert('צריך להקליד שם.'); return; }
    const newAvatar = myProfilePicker.getData();
    try{
      await apiPatch('users', {id: me.id, name: newName, avatar: newAvatar});
    }catch(err){
      console.error(err);
      alert('שגיאה בשמירה - בדוק/י את חיבור ה-DB');
      return;
    }
    me.name = newName;
    me.avatar = newAvatar;
    saveMe();
    renderSelfAvatar();
    document.getElementById('myProfileModal').classList.remove('show');
  });

  boot();
})();

</script>
